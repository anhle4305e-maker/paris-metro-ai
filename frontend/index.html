<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris Metro Router AI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="search-panel">
        <h2>🚇 Paris Metro AI</h2>
        
        <div class="input-group autocomplete-container">
            <input type="text" id="start-station" placeholder="Ga xuất phát (VD: Auber)" autocomplete="off">
            <div id="start-suggestions" class="suggestions-list"></div>
        </div>
        
        <div class="input-group autocomplete-container">
            <input type="text" id="end-station" placeholder="Ga đích (VD: La Défense)" autocomplete="off">
            <div id="end-suggestions" class="suggestions-list"></div>
        </div>
        
        <button onclick="findRoute()">Tìm đường</button>
        <div id="status-message"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
